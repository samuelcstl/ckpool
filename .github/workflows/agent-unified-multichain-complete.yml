name: agent-unified-multichain-complete

on:
  push:
    branches:
      - agent/unified-multichain-complete-v1

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch driver
        uses: actions/checkout@v4
        with:
          ref: agent/unified-multichain-complete-v1
          path: patcher
          fetch-depth: 1

      - name: Checkout current unified branch
        uses: actions/checkout@v4
        with:
          ref: unified-multichain-v1
          path: src
          fetch-depth: 0
          submodules: recursive

      - name: Verify PPC baseline
        working-directory: src
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "f3c950745779ad4d4170300ad894a3d87f4af1e0"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config yasm \
            libzmq3-dev libsodium-dev libssl-dev

      - name: Configure git author
        working-directory: src
        run: |
          git config user.name "Samuel Castel"
          git config user.email "2681949+samuelcstl@users.noreply.github.com"

      - name: Prepare final-phase patch driver
        working-directory: src
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patcher/tools/agent_multichain_complete.py')
          s = p.read_text()

          old = 'ROOT = Path(__file__).resolve().parents[1]'
          if s.count(old) != 1:
              raise SystemExit(f'patch-root marker count={s.count(old)}')
          s = s.replace(old, 'ROOT = Path.cwd()', 1)

          old = '\t\t\tuchar compact[4];'
          if s.count(old) != 1:
              raise SystemExit(f'compact target marker count={s.count(old)}')
          s = s.replace(old, '\t\t\tchar compact[4];', 1)

          old = '''\tuint8_t hash160[20] = {0};\n\tchar address[128], config[2048], gbtjson[2048];'''
          new = '''\tconst char *address = "ecash:qpm2qsznhks23z7629mms6s4cwef74vcwva87rkuu2";\n\tchar config[2048], gbtjson[2048];'''
          if s.count(old) != 1:
              raise SystemExit(f'fixture declaration marker count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''\thash160[0] = 0x42;\n\tif (!cashaddr_from_hash160(address, sizeof(address), "ecash", hash160, false))\n\t\treturn 10;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'fixture generator marker count={s.count(old)}')
          s = s.replace(old, '', 1)

          old = '''        'chaincaps_SOURCES = chaincaps_test.c $(top_srcdir)/src/multichain.c\\nchaincaps_LDADD = $(top_srcdir)/src/libckpool.a',\n        'chaincaps_SOURCES = chaincaps_test.c $(top_srcdir)/src/multichain.c $(top_srcdir)/src/payout.c\\nchaincaps_LDADD = $(top_srcdir)/src/libckpool.a','''
          new = '''        'chaincaps_SOURCES = chaincaps_test.c $(top_srcdir)/src/multichain.c $(top_srcdir)/src/yyjson.c\\nchaincaps_LDADD = $(top_srcdir)/src/libckpool.a',\n        'chaincaps_SOURCES = chaincaps_test.c $(top_srcdir)/src/multichain.c $(top_srcdir)/src/payout.c $(top_srcdir)/src/yyjson.c\\nchaincaps_LDADD = $(top_srcdir)/src/libckpool.a','''
          if s.count(old) != 1:
              raise SystemExit(f'phase3 test-link marker count={s.count(old)}')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Phase 3 - GBT outputs and effective target
        working-directory: src
        run: |
          set -Eeuo pipefail
          python3 ../patcher/tools/agent_multichain_complete.py phase3
          ./autogen.sh
          ./configure
          make -j2
          make check
          git add src/multichain.c src/multichain.h src/stratifier.h src/bitcoin.c \
                  src/stratifier.c test/Makefile.am test/chaincaps_test.c MULTICHAIN.md
          git diff --cached --check
          git commit -m "multichain: add GBT-defined outputs and effective target"
          git push origin HEAD:unified-multichain-v1

      - name: Final regression and policy audit
        working-directory: src
        run: |
          set -Eeuo pipefail
          make check
          test -z "$(git status --porcelain)"
          ! grep -RniE 'if[[:space:]]*\([^)]*(BTC|BCH|DGB|AUR|BFX|LCC|PPC|XEC)|strcmp\([^,]+,[[:space:]]*"(BTC|BCH|DGB|AUR|BFX|LCC|PPC|XEC)' \
            src/multichain.c src/payout.c src/bitcoin.c src/stratifier.c
          grep -q '"cashaddr_prefix": "ecash"' MULTICHAIN.md
          grep -q '"gbttarget": "/rtt/nexttarget"' MULTICHAIN.md
          grep -q '"coinbase_txntime": true' MULTICHAIN.md
          git status --short --branch
          git log -5 --oneline
