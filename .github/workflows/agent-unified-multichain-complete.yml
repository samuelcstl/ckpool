name: agent-unified-multichain-complete

on:
  push:
    branches:
      - agent/unified-multichain-complete-v1

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch driver
        uses: actions/checkout@v4
        with:
          ref: agent/unified-multichain-complete-v1
          path: patcher
          fetch-depth: 1

      - name: Checkout clean target branch
        uses: actions/checkout@v4
        with:
          ref: unified-multichain-v1
          path: src
          fetch-depth: 0
          submodules: recursive

      - name: Verify target revision
        working-directory: src
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "ee5383e3620a725c6c74f57f823e9dbfbc38d2b2"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config yasm \
            libzmq3-dev libsodium-dev libssl-dev

      - name: Configure git author
        working-directory: src
        run: |
          git config user.name "Samuel Castel"
          git config user.email "2681949+samuelcstl@users.noreply.github.com"

      - name: Prepare patch driver for clean target checkout
        working-directory: src
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patcher/tools/agent_multichain_complete.py')
          s = p.read_text()
          old = 'ROOT = Path(__file__).resolve().parents[1]'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one patch-root marker, got {s.count(old)}')
          s = s.replace(old, 'ROOT = Path.cwd()', 1)

          old_link = 'chaincaps_SOURCES = chaincaps_test.c $(top_srcdir)/src/multichain.c\\nchaincaps_LDADD'
          new_link = 'chaincaps_SOURCES = chaincaps_test.c $(top_srcdir)/src/multichain.c $(top_srcdir)/src/yyjson.c\\nchaincaps_LDADD'
          if s.count(old_link) != 2:
              raise SystemExit(f'expected two chaincaps link markers, got {s.count(old_link)}')
          s = s.replace(old_link, new_link)

          old_phase3 = 'chaincaps_SOURCES = chaincaps_test.c $(top_srcdir)/src/multichain.c $(top_srcdir)/src/payout.c\\nchaincaps_LDADD'
          new_phase3 = 'chaincaps_SOURCES = chaincaps_test.c $(top_srcdir)/src/multichain.c $(top_srcdir)/src/payout.c $(top_srcdir)/src/yyjson.c\\nchaincaps_LDADD'
          if s.count(old_phase3) != 1:
              raise SystemExit(f'expected one phase3 link marker, got {s.count(old_phase3)}')
          s = s.replace(old_phase3, new_phase3, 1)
          p.write_text(s)
          PY

      - name: Phase 1 - generic capability framework
        working-directory: src
        run: |
          set -Eeuo pipefail
          python3 ../patcher/tools/agent_multichain_complete.py phase1
          ./autogen.sh
          ./configure
          make -j2
          make check
          git add src/Makefile.am src/bitcoin.c src/multichain.c src/multichain.h \
                  test/Makefile.am test/chaincaps_test.c
          git diff --cached --check
          git commit -m "multichain: add generic consensus capability config"
          git push origin HEAD:unified-multichain-v1

      - name: Phase 2 - qualified PPC serialization wiring
        working-directory: src
        run: |
          set -Eeuo pipefail
          python3 ../patcher/tools/agent_multichain_complete.py phase2
          ./autogen.sh
          ./configure
          make -j2
          make check
          git add src/stratifier.c MULTICHAIN.md
          git diff --cached --check
          git commit -m "ppc: wire generic serialization capabilities"
          git push origin HEAD:unified-multichain-v1

      - name: Phase 3 - GBT outputs and effective target
        working-directory: src
        run: |
          set -Eeuo pipefail
          python3 ../patcher/tools/agent_multichain_complete.py phase3
          ./autogen.sh
          ./configure
          make -j2
          make check
          git add src/multichain.c src/multichain.h src/stratifier.h src/bitcoin.c \
                  src/stratifier.c test/Makefile.am test/chaincaps_test.c MULTICHAIN.md
          git diff --cached --check
          git commit -m "multichain: add GBT-defined outputs and effective target"
          git push origin HEAD:unified-multichain-v1

      - name: Final branch summary
        working-directory: src
        run: |
          set -Eeuo pipefail
          git status --short --branch
          git log -4 --oneline
          make check
