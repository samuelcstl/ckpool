name: agent-unified-multichain-complete

on:
  push:
    branches:
      - agent/unified-multichain-complete-v1

permissions:
  contents: write

jobs:
  cashaddr-admission:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-multichain-v1
          fetch-depth: 0
          submodules: recursive

      - name: Verify hardened baseline
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "3cb83f434016fa07500df1b25a1b290813606bb1"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config yasm \
            libzmq3-dev libsodium-dev libssl-dev

      - name: Configure git author
        run: |
          git config user.name "Samuel Castel"
          git config user.email "2681949+samuelcstl@users.noreply.github.com"

      - name: Wire generic local CashAddr admission
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/bitcoin.h')
          s = p.read_text()
          old = '''int payout_address_to_txn(char *p2h, const char *addr, const bool script,\n                          const bool segwit);'''
          new = '''int payout_address_to_txn(char *p2h, const char *addr, const bool script,\n                          const bool segwit);\nbool payout_address_is_cashaddr(const char *addr, bool *script, bool *segwit);'''
          if s.count(old) != 1:
              raise SystemExit(f'bitcoin.h marker count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/payout.c')
          s = p.read_text()
          marker = '''int payout_address_to_txn(char *p2h, const char *addr, const bool script,\n                          const bool segwit)\n{'''
          helper = '''bool payout_address_is_cashaddr(const char *addr, bool *script, bool *segwit)\n{\n\tuint8_t hash160[20];\n\tbool is_p2sh;\n\n\tpthread_once(&cashaddr_prefix_once, load_cashaddr_prefix);\n\tif (!cashaddr_prefix_configured || unlikely(!cashaddr_prefix_valid))\n\t\treturn false;\n\tif (!cashaddr_decode(addr, cashaddr_prefix, hash160, &is_p2sh))\n\t\treturn false;\n\tif (script)\n\t\t*script = is_p2sh;\n\tif (segwit)\n\t\t*segwit = false;\n\treturn true;\n}\n\nint payout_address_to_txn(char *p2h, const char *addr, const bool script,\n                          const bool segwit)\n{'''
          if s.count(marker) != 1:
              raise SystemExit(f'payout.c marker count={s.count(marker)}')
          p.write_text(s.replace(marker, helper, 1))

          p = Path('src/stratifier.c')
          s = p.read_text()
          marker = '''/* This simply strips off the first part of the workername and matches it to a\n * user or creates a new one. Needs to be entered with client holding a ref\n * count. */'''
          helper = '''/* Prefer the configured local payout codec when it can prove an address is\n * valid. Everything else stays on the upstream daemon-validation path. */\nstatic bool payout_address_valid(const char *address, bool *script, bool *segwit)\n{\n\tif (payout_address_is_cashaddr(address, script, segwit))\n\t\treturn true;\n\treturn generator_checkaddr(address, script, segwit);\n}\n\n/* This simply strips off the first part of the workername and matches it to a\n * user or creates a new one. Needs to be entered with client holding a ref\n * count. */'''
          if s.count(marker) != 1:
              raise SystemExit(f'stratifier helper marker count={s.count(marker)}')
          s = s.replace(marker, helper, 1)

          replacements = [
              ('if (generator_checkaddr(username, &user->script, &user->segwit)) {',
               'if (payout_address_valid(username, &user->script, &user->segwit)) {'),
              ('if (!generator_checkaddr(ckpool.btcaddress, &ckpool.script, &ckpool.segwit)) {',
               'if (!payout_address_valid(ckpool.btcaddress, &ckpool.script, &ckpool.segwit)) {'),
              ('if (generator_checkaddr(ckpool.donaddress, &ckpool.donscript, &ckpool.donsegwit)) {',
               'if (payout_address_valid(ckpool.donaddress, &ckpool.donscript, &ckpool.donsegwit)) {'),
              ('} else if (generator_checkaddr(ckpool.tndonaddress, &ckpool.donscript, &ckpool.donsegwit)) {',
               '} else if (payout_address_valid(ckpool.tndonaddress, &ckpool.donscript, &ckpool.donsegwit)) {'),
              ('} else if (generator_checkaddr(ckpool.rtdonaddress, &ckpool.donscript, &ckpool.donsegwit)) {',
               '} else if (payout_address_valid(ckpool.rtdonaddress, &ckpool.donscript, &ckpool.donsegwit)) {'),
              ('LOGEMERG("Fatal: btcaddress invalid according to bitcoind");',
               'LOGEMERG("Fatal: payout address invalid according to configured codec/node");'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'stratifier marker count={s.count(old)} for {old[:50]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Extend BCH and XEC admission regressions
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/chain_profiles.c')
          s = p.read_text()
          old = '''    static const char *addr = "bitcoincash:qpm2qsznhks23z7629mms6s4cwef74vcwvy22gdx6a";\n    char script[64];\n    char *path = write_config("{\\"cashaddr_prefix\\":\\"bitcoincash\\",\\"gbtdrop\\":[\\"rules\\"]}\\n");\n    int len, rc = 0;'''
          new = '''    static const char *addr = "bitcoincash:qpm2qsznhks23z7629mms6s4cwef74vcwvy22gdx6a";\n    static const char *prefixless = "qpm2qsznhks23z7629mms6s4cwef74vcwvy22gdx6a";\n    static const char *p2sh = "bitcoincash:ppm2qsznhks23z7629mms6s4cwef74vcwvn0h829pq";\n    char script[64];\n    bool is_script = false, segwit = true;\n    char *path = write_config("{\\"cashaddr_prefix\\":\\"bitcoincash\\",\\"gbtdrop\\":[\\"rules\\"]}\\n");\n    int len, rc = 0;'''
          if s.count(old) != 1:
              raise SystemExit(f'BCH declaration marker count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''    if (!multichain_config_valid())\n        rc = 2;\n    else if ((len = payout_address_to_txn(script, addr, false, false)) != 25)\n        rc = 3;\n    else if ((unsigned char)script[0] != 0x76 || (unsigned char)script[1] != 0xa9 ||\n             (unsigned char)script[2] != 0x14 || (unsigned char)script[23] != 0x88 ||\n             (unsigned char)script[24] != 0xac)\n        rc = 4;'''
          new = '''    if (!multichain_config_valid())\n        rc = 2;\n    else if (!payout_address_is_cashaddr(addr, &is_script, &segwit) || is_script || segwit)\n        rc = 3;\n    else if (!payout_address_is_cashaddr(prefixless, &is_script, &segwit) || is_script || segwit)\n        rc = 4;\n    else if (!payout_address_is_cashaddr(p2sh, &is_script, &segwit) || !is_script || segwit)\n        rc = 5;\n    else if (payout_address_is_cashaddr("ecash:qpm2qsznhks23z7629mms6s4cwef74vcwva87rkuu2",\n                                        &is_script, &segwit))\n        rc = 6;\n    else if ((len = payout_address_to_txn(script, addr, false, false)) != 25)\n        rc = 7;\n    else if ((unsigned char)script[0] != 0x76 || (unsigned char)script[1] != 0xa9 ||\n             (unsigned char)script[2] != 0x14 || (unsigned char)script[23] != 0x88 ||\n             (unsigned char)script[24] != 0xac)\n        rc = 8;'''
          if s.count(old) != 1:
              raise SystemExit(f'BCH assertion marker count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''    if (multichain_coinbase_txntime() || !multichain_validate_coinbase() ||\n        multichain_preciousblock() || multichain_block_suffix()) {\n        rc = 3;\n        goto out;\n    }'''
          new = '''    if (multichain_coinbase_txntime() || !multichain_validate_coinbase() ||\n        multichain_preciousblock() || multichain_block_suffix()) {\n        rc = 3;\n        goto out;\n    }\n    {\n        bool is_script = true, segwit = true;\n        if (!payout_address_is_cashaddr(addr, &is_script, &segwit) || is_script || segwit) {\n            rc = 8;\n            goto out;\n        }\n    }'''
          if s.count(old) != 1:
              raise SystemExit(f'XEC admission marker count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Update admission documentation
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MULTICHAIN.md')
          s = p.read_text()
          old = '''CashAddr P2PKH/P2SH script construction is local and prefix-driven. Legacy Base58 and SegWit script construction remains on the upstream path when CashAddr does not match. Daemon `validateaddress` remains authoritative for configured and username-derived payout acceptance; the final live BCH qualification therefore checks those entry paths as well as script construction.'''
          new = '''CashAddr P2PKH/P2SH admission and script construction are local and prefix-driven, including valid prefixless CashAddr payloads. When an address does not match the configured CashAddr prefix, validation and Base58/SegWit construction fall back to the upstream daemon path. This keeps default Bitcoin behavior unchanged while removing a daemon-format dependency from BCH/XEC configured and username-derived payouts.'''
          if s.count(old) != 1:
              raise SystemExit(f'doc marker count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Native hosted build and regression suite
        run: |
          set -Eeuo pipefail
          ./autogen.sh
          ./configure
          make -j2
          make check

      - name: Focused source audit
        run: |
          set -Eeuo pipefail
          git diff --check
          grep -q 'payout_address_is_cashaddr' src/payout.c
          grep -q 'payout_address_valid(username' src/stratifier.c
          grep -q 'payout_address_valid(ckpool.btcaddress' src/stratifier.c
          grep -q 'prefixless' test/chain_profiles.c
          ! grep -nE 'if[[:space:]]*\([^)]*(BCH|XEC|PPC|LCC|DGB|AUR|BFX)' \
            src/payout.c src/multichain.c src/bitcoin.c src/stratifier.c

      - name: Commit tested admission support
        run: |
          set -Eeuo pipefail
          git add src/bitcoin.h src/payout.c src/stratifier.c test/chain_profiles.c MULTICHAIN.md
          git diff --cached --check
          git commit -m "cashaddr: admit configured-prefix payout addresses locally"
          git push origin HEAD:unified-multichain-v1
          git log -5 --oneline
