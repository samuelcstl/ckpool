name: agent-unified-multichain-complete

on:
  push:
    branches:
      - agent/unified-multichain-complete-v1

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-multichain-v1
          fetch-depth: 0

      - name: Verify phase-3 head
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "64f8e85309504b5323ccafa837102f3b0790fdac"

      - name: Audit generator GBT handoff
        run: |
          set -Eeuo pipefail
          echo '=== generator_getbase definition ==='
          grep -n -B20 -A140 'generator_getbase' src/generator.c || true
          echo '=== gbt/work structure ==='
          grep -n -B10 -A80 'struct genwork' src/stratifier.h || true
          echo '=== mandatory/effective references ==='
          grep -RniE 'mandatory_output|mandatory_outputs|effective_diff|multichain_apply_gbt' src | head -200
          echo '=== allocation site ==='
          grep -n -B5 -A35 'mandatory_outputs \*' src/stratifier.c || true
