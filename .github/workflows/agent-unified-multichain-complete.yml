name: agent-unified-multichain-complete

on:
  push:
    branches: [agent/unified-multichain-complete-v1]

permissions:
  contents: write

jobs:
  final-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-multichain-v1
          fetch-depth: 0
          submodules: recursive

      - name: Verify CashAddr-admission baseline
        run: test "$(git rev-parse HEAD)" = "607894d0dc21e0f67a983d3f7dd7bb5f0533d6eb"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config yasm libzmq3-dev libsodium-dev libssl-dev

      - name: Configure git author
        run: |
          git config user.name "Samuel Castel"
          git config user.email "2681949+samuelcstl@users.noreply.github.com"

      - name: Enforce payout constructibility under local codec
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/bitcoin.h')
          s = p.read_text()
          old = 'bool payout_address_is_cashaddr(const char *addr, bool *script, bool *segwit);'
          new = old + '\nbool payout_local_codec_enabled(void);'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))

          p = Path('src/payout.c')
          s = p.read_text()
          marker = '''bool payout_address_is_cashaddr(const char *addr, bool *script, bool *segwit)
          {'''
          helper = '''bool payout_local_codec_enabled(void)
          {
          \tpthread_once(&cashaddr_prefix_once, load_cashaddr_prefix);
          \treturn cashaddr_prefix_configured && cashaddr_prefix_valid;
          }

          bool payout_address_is_cashaddr(const char *addr, bool *script, bool *segwit)
          {'''
          assert s.count(marker) == 1, s.count(marker)
          p.write_text(s.replace(marker, helper, 1))

          p = Path('src/stratifier.c')
          s = p.read_text()
          old = '''static bool payout_address_valid(const char *address, bool *script, bool *segwit)
          {
          \tif (payout_address_is_cashaddr(address, script, segwit))
          \t\treturn true;
          \treturn generator_checkaddr(address, script, segwit);
          }'''
          new = '''static bool payout_address_valid(const char *address, bool *script, bool *segwit)
          {
          \tchar txnbin[256];

          \tif (payout_address_is_cashaddr(address, script, segwit))
          \t\treturn true;
          \tif (!generator_checkaddr(address, script, segwit))
          \t\treturn false;
          \t/* With an opt-in local payout codec, do not admit a newer daemon-
          \t * accepted address form unless the exact serializer we will use for
          \t * coinbase construction can encode it too. Default Bitcoin behavior
          \t * remains unchanged when no local codec is configured. */
          \tif (payout_local_codec_enabled() &&
          \t    payout_address_to_txn(txnbin, address, *script, *segwit) <= 0) {
          \t\tLOGWARNING("Node accepted payout address unsupported by configured codec: %s",
          \t\t\t   address);
          \t\treturn false;
          \t}
          \treturn true;
          }'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Extend profile invariants
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/chain_profiles.c')
          s = p.read_text()
          old = '''    if (!multichain_config_valid())
                  return 1;
              if (multichain_coinbase_txntime() || !multichain_validate_coinbase() ||
                  !multichain_preciousblock() || multichain_block_suffix())
                  return 2;'''
          new = '''    if (!multichain_config_valid())
                  return 1;
              if (payout_local_codec_enabled())
                  return 2;
              if (multichain_coinbase_txntime() || !multichain_validate_coinbase() ||
                  !multichain_preciousblock() || multichain_block_suffix())
                  return 3;'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = '''    if (!multichain_config_valid())
                  rc = 2;
              else if (!payout_address_is_cashaddr(addr, &is_script, &segwit) || is_script || segwit)'''
          new = '''    if (!multichain_config_valid())
                  rc = 2;
              else if (!payout_local_codec_enabled())
                  rc = 3;
              else if (!payout_address_is_cashaddr(addr, &is_script, &segwit) || is_script || segwit)'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Finish public compatibility documentation
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MULTICHAIN.md')
          s = p.read_text()
          old = '| LCC | not yet deployed | n/a | n/a | first new lane; SHA256d GBT selection is the immediate requirement |'
          new = '| LCC | unified multichain fork | `6ff395fb` live baseline | none | SHA256d GBT path is live-proven, including main-chain block 4507116 |'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = '## Capability inventory before fleet qualification\n\nThe fork is not considered fleet-ready until every consensus- or payout-relevant delta from the proven implementations is represented and tested.'
          new = '## Capability inventory\n\nAll currently known consensus- and payout-relevant deltas from the proven implementations are represented behind generic capabilities. Fleet readiness remains gated on the consolidated ARM64 and live-node acceptance pass.'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = '| strict negotiated SV1 version mask | hardening target | important (`0000e000`) | important | useful | useful |'
          new = '| strict negotiated SV1 version mask | implemented | implemented; LCC live-proven at `0000e000` | implemented; PPC qualified at `1fffe000` | implemented | implemented |'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = 'When an address does not match the configured CashAddr prefix, validation and Base58/SegWit construction fall back to the upstream daemon path. This keeps default Bitcoin behavior unchanged while removing a daemon-format dependency from BCH/XEC configured and username-derived payouts.'
          new = 'When an address does not match the configured CashAddr prefix, validation and Base58/SegWit construction fall back to the upstream daemon path. While a local codec is configured, a daemon-accepted fallback address is admitted only if the payout serializer can encode it, preventing newer unsupported address forms from producing an unusable coinbase output. Default Bitcoin behavior remains unchanged when no local codec is configured.'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Native hosted build and complete regression suite
        run: |
          set -Eeuo pipefail
          ./autogen.sh
          ./configure
          make -j2
          make check

      - name: Final source policy audit
        run: |
          set -Eeuo pipefail
          git diff --check
          grep -q 'payout_local_codec_enabled' src/payout.c
          grep -q 'unsupported by configured codec' src/stratifier.c
          grep -q 'main-chain block 4507116' MULTICHAIN.md
          grep -q 'LCC live-proven at `0000e000`' MULTICHAIN.md
          ! grep -nE 'if[[:space:]]*\([^)]*(BCH|XEC|PPC|LCC|DGB|AUR|BFX)' src/payout.c src/multichain.c src/bitcoin.c src/stratifier.c

      - name: Commit final tested source hardening
        run: |
          set -Eeuo pipefail
          git add src/bitcoin.h src/payout.c src/stratifier.c test/chain_profiles.c MULTICHAIN.md
          git diff --cached --check
          git commit -m "multichain: require constructible payout addresses"
          git push origin HEAD:unified-multichain-v1
          git log -6 --oneline
