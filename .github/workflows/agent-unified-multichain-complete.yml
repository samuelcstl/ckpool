name: agent-unified-multichain-complete

on:
  push:
    branches:
      - agent/unified-multichain-complete-v1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-multichain-v1
          fetch-depth: 0
          submodules: recursive

      - name: Verify phase-3 head
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "64f8e85309504b5323ccafa837102f3b0790fdac"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config yasm \
            libzmq3-dev libsodium-dev libssl-dev

      - name: Configure git author
        run: |
          git config user.name "Samuel Castel"
          git config user.email "2681949+samuelcstl@users.noreply.github.com"

      - name: Harden serializer allocation
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/stratifier.c')
          s = p.read_text()
          old = '''\twb->coinb3bin = ckzalloc(512 + wb->mandatory_outputs * (8 + 1 + MAX_GBT_OUTPUT_SCRIPT_LEN) +\n\t\t\t       wb->insert_witness * (8 + witnessdata_size + 2));'''
          new = '''\t/* A configured script may be up to 512 bytes, which uses the three-byte\n\t * CompactSize form (0xfd + uint16). Reserve for the largest wire form,\n\t * not merely the one-byte prefix used by normal P2PKH/P2SH outputs. */\n\twb->coinb3bin = ckzalloc(512 + wb->mandatory_outputs * (8 + 3 + MAX_GBT_OUTPUT_SCRIPT_LEN) +\n\t\t\t       wb->insert_witness * (8 + witnessdata_size + 2));'''
          if s.count(old) != 1:
              raise SystemExit(f'allocation marker count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''\t\t/* Configured mandatory scripts are bounded below CompactSize's 0xfd\n\t\t * threshold by MAX_GBT_OUTPUT_SCRIPT_LEN only in storage; encode the\n\t\t * full CompactSize form here so the generic path is not chain-sized. */'''
          new = '''\t\t/* Encode full CompactSize so the generic path also handles configured\n\t\t * scripts at and above the 0xfd threshold. */'''
          if s.count(old) != 1:
              raise SystemExit(f'comment marker count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Add profile regression matrix
        run: |
          set -Eeuo pipefail
          cat > test/chain_profiles.c <<'EOF'
          /* End-to-end configuration profile regressions for the generic multichain layer. */
          #include "config.h"

          #include <math.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <unistd.h>

          #include "ckpool.h"
          #include "bitcoin.h"
          #include "multichain.h"
          #include "stratifier.h"
          #include "yyjson.h"

          ckpool_t ckpool;

          static char *write_config(const char *json)
          {
              char tmpl[] = "/var/tmp/ckpool-profile-XXXXXX";
              int fd = mkstemp(tmpl);
              FILE *f;

              if (fd < 0)
                  return NULL;
              f = fdopen(fd, "w");
              if (!f) {
                  close(fd);
                  unlink(tmpl);
                  return NULL;
              }
              if (fputs(json, f) < 0 || fclose(f)) {
                  unlink(tmpl);
                  return NULL;
              }
              return strdup(tmpl);
          }

          static void cleanup_config(char *path)
          {
              if (!path)
                  return;
              unlink(path);
              free(path);
          }

          static int profile_default(void)
          {
              memset(&ckpool, 0, sizeof(ckpool));
              if (!multichain_config_valid())
                  return 1;
              if (multichain_coinbase_txntime() || !multichain_validate_coinbase() ||
                  !multichain_preciousblock() || multichain_block_suffix())
                  return 2;
              return 0;
          }

          static int profile_ppc(void)
          {
              char *path = write_config("{\"coinbase_txntime\":true,\"block_suffix\":\"00\",\"validate_coinbase\":false}\n");
              const char *suffix;
              int rc = 0;

              if (!path)
                  return 1;
              memset(&ckpool, 0, sizeof(ckpool));
              ckpool.config = path;
              if (!multichain_config_valid())
                  rc = 2;
              else if (!multichain_coinbase_txntime() || multichain_validate_coinbase())
                  rc = 3;
              else if (!multichain_preciousblock())
                  rc = 4;
              else if (!(suffix = multichain_block_suffix()) || strcmp(suffix, "00"))
                  rc = 5;
              cleanup_config(path);
              return rc;
          }

          static int profile_bch(void)
          {
              static const char *addr = "bitcoincash:qpm2qsznhks23z7629mms6s4cwef74vcwvy22gdx6a";
              char script[64];
              char *path = write_config("{\"cashaddr_prefix\":\"bitcoincash\",\"gbtdrop\":[\"rules\"]}\n");
              int len, rc = 0;

              if (!path)
                  return 1;
              memset(&ckpool, 0, sizeof(ckpool));
              ckpool.config = path;
              if (!multichain_config_valid())
                  rc = 2;
              else if ((len = payout_address_to_txn(script, addr, false, false)) != 25)
                  rc = 3;
              else if ((unsigned char)script[0] != 0x76 || (unsigned char)script[1] != 0xa9 ||
                       (unsigned char)script[2] != 0x14 || (unsigned char)script[23] != 0x88 ||
                       (unsigned char)script[24] != 0xac)
                  rc = 4;
              cleanup_config(path);
              return rc;
          }

          static int profile_xec(void)
          {
              static const char *addr = "ecash:qpm2qsznhks23z7629mms6s4cwef74vcwva87rkuu2";
              char config[2048], gbtjson[2048];
              struct genwork gbt;
              yyjson_doc *doc = NULL;
              yyjson_val *root;
              char *path;
              int rc = 0;

              snprintf(config, sizeof(config),
                  "{\"cashaddr_prefix\":\"ecash\",\"preciousblock\":false,"
                  "\"gbttarget\":\"/rtt/nexttarget\",\"gbtoutputs\":["
                  "{\"amount\":\"/coinbasetxn/minerfund/minimumvalue\","
                  "\"address\":\"/coinbasetxn/minerfund/addresses/0\"},"
                  "{\"amount\":\"/coinbasetxn/stakingrewards/minimumvalue\","
                  "\"script\":\"/coinbasetxn/stakingrewards/payoutscript/hex\"}]}\n");
              path = write_config(config);
              if (!path)
                  return 1;
              memset(&ckpool, 0, sizeof(ckpool));
              ckpool.config = path;
              if (!multichain_config_valid()) {
                  rc = 2;
                  goto out;
              }
              if (multichain_coinbase_txntime() || !multichain_validate_coinbase() ||
                  multichain_preciousblock() || multichain_block_suffix()) {
                  rc = 3;
                  goto out;
              }
              snprintf(gbtjson, sizeof(gbtjson),
                  "{\"coinbasetxn\":{\"minerfund\":{\"minimumvalue\":3200,"
                  "\"addresses\":[\"%s\"]},\"stakingrewards\":{\"minimumvalue\":1000,"
                  "\"payoutscript\":{\"hex\":\"51\"}}},\"rtt\":{\"nexttarget\":\"1d00ffff\"}}",
                  addr);
              doc = yyjson_read(gbtjson, strlen(gbtjson), 0);
              if (!doc) {
                  rc = 4;
                  goto out;
              }
              root = yyjson_doc_get_root(doc);
              memset(&gbt, 0, sizeof(gbt));
              gbt.coinbasevalue = 10000;
              gbt.diff = 9.0;
              if (!multichain_apply_gbt(&gbt, root))
                  rc = 5;
              else if (gbt.mandatory_outputs != 2 ||
                       gbt.mandatory_output[0].amount != 3200 ||
                       gbt.mandatory_output[0].script_len != 25 ||
                       gbt.mandatory_output[1].amount != 1000 ||
                       gbt.mandatory_output[1].script_len != 1 ||
                       gbt.mandatory_output[1].script[0] != 0x51)
                  rc = 6;
              else if (fabs(gbt.effective_diff - 1.0) > 0.000001)
                  rc = 7;
          out:
              if (doc)
                  yyjson_doc_free(doc);
              cleanup_config(path);
              return rc;
          }

          static int profile_target_fallback(void)
          {
              struct genwork gbt;
              yyjson_doc *doc;
              char *path = write_config("{\"gbttarget\":\"/rtt/nexttarget\"}\n");
              int rc = 0;

              if (!path)
                  return 1;
              memset(&ckpool, 0, sizeof(ckpool));
              ckpool.config = path;
              doc = yyjson_read("{}", 2, 0);
              if (!doc)
                  rc = 2;
              else {
                  memset(&gbt, 0, sizeof(gbt));
                  gbt.coinbasevalue = 1;
                  gbt.diff = 7.0;
                  if (!multichain_apply_gbt(&gbt, yyjson_doc_get_root(doc)))
                      rc = 3;
                  else if (fabs(gbt.effective_diff - 7.0) > 0.000001)
                      rc = 4;
                  yyjson_doc_free(doc);
              }
              cleanup_config(path);
              return rc;
          }

          static int profile_max_script(void)
          {
              char script_hex[MAX_GBT_OUTPUT_SCRIPT_LEN * 2 + 1];
              char *gbtjson = NULL, *path;
              struct genwork gbt;
              yyjson_doc *doc = NULL;
              int i, rc = 0;

              path = write_config("{\"gbtoutputs\":[{\"amount\":\"/required/value\",\"script\":\"/required/script\"}]}\n");
              if (!path)
                  return 1;
              for (i = 0; i < MAX_GBT_OUTPUT_SCRIPT_LEN; i++) {
                  script_hex[i * 2] = '5';
                  script_hex[i * 2 + 1] = '1';
              }
              script_hex[sizeof(script_hex) - 1] = '\0';
              if (asprintf(&gbtjson, "{\"required\":{\"value\":1,\"script\":\"%s\"}}", script_hex) < 0) {
                  cleanup_config(path);
                  return 2;
              }
              memset(&ckpool, 0, sizeof(ckpool));
              ckpool.config = path;
              doc = yyjson_read(gbtjson, strlen(gbtjson), 0);
              if (!doc)
                  rc = 3;
              else {
                  memset(&gbt, 0, sizeof(gbt));
                  gbt.coinbasevalue = 2;
                  gbt.diff = 1.0;
                  if (!multichain_apply_gbt(&gbt, yyjson_doc_get_root(doc)))
                      rc = 4;
                  else if (gbt.mandatory_outputs != 1 ||
                           gbt.mandatory_output[0].script_len != MAX_GBT_OUTPUT_SCRIPT_LEN ||
                           gbt.mandatory_output[0].script[MAX_GBT_OUTPUT_SCRIPT_LEN - 1] != 0x51)
                      rc = 5;
                  yyjson_doc_free(doc);
              }
              free(gbtjson);
              cleanup_config(path);
              return rc;
          }

          static void run_child(int (*fn)(void), const char *name)
          {
              pid_t pid = fork();
              int status;

              if (pid < 0) {
                  fprintf(stderr, "FAIL: fork %s\n", name);
                  exit(1);
              }
              if (!pid)
                  exit(fn());
              if (waitpid(pid, &status, 0) != pid || !WIFEXITED(status) || WEXITSTATUS(status)) {
                  fprintf(stderr, "FAIL: %s rc=%d\n", name,
                          WIFEXITED(status) ? WEXITSTATUS(status) : 255);
                  exit(1);
              }
          }

          int main(void)
          {
              /* These five lanes intentionally share Bitcoin-default consensus capabilities. */
              run_child(profile_default, "btc-default");
              run_child(profile_default, "dgb-default-caps");
              run_child(profile_default, "aur-default-caps");
              run_child(profile_default, "bfx-default-caps");
              run_child(profile_default, "lcc-default-caps");
              run_child(profile_bch, "bch-cashaddr");
              run_child(profile_ppc, "ppc-serialization");
              run_child(profile_xec, "xec-gbt-consensus");
              run_child(profile_target_fallback, "target-fallback");
              run_child(profile_max_script, "max-script-boundary");
              puts("Eight-chain profile regressions passed");
              return 0;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/Makefile.am')
          s = p.read_text()
          s = s.replace('check_PROGRAMS = sha256 bip310 cashaddr chaincaps\nTESTS = sha256 bip310 cashaddr chaincaps\n',
                        'check_PROGRAMS = sha256 bip310 cashaddr chaincaps chain_profiles\nTESTS = sha256 bip310 cashaddr chaincaps chain_profiles\n')
          marker = 'chaincaps_LDADD = $(top_srcdir)/src/libckpool.a\n'
          add = ('chaincaps_LDADD = $(top_srcdir)/src/libckpool.a\n'
                 'chain_profiles_SOURCES = chain_profiles.c $(top_srcdir)/src/multichain.c $(top_srcdir)/src/payout.c $(top_srcdir)/src/yyjson.c\n'
                 'chain_profiles_LDADD = $(top_srcdir)/src/libckpool.a\n')
          if s.count(marker) != 1:
              raise SystemExit(f'Makefile marker count={s.count(marker)}')
          p.write_text(s.replace(marker, add, 1))
          PY

      - name: Update multichain qualification documentation
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MULTICHAIN.md')
          s = p.read_text()
          old = '''### Bitcoin Cash GBT\n\nThe deployed BCH fork requests a template without the SegWit `rules` member. The generic equivalent is:\n\n```json\n{\n  "gbtdrop": ["rules"]\n}\n```'''
          new = '''### Bitcoin Cash GBT and payout codec\n\nThe deployed BCH fork requests a template without the SegWit `rules` member and uses CashAddr payouts. The generic profile is:\n\n```json\n{\n  "gbtdrop": ["rules"],\n  "cashaddr_prefix": "bitcoincash"\n}\n```\n\nCashAddr P2PKH/P2SH script construction is local and prefix-driven. Legacy Base58 and SegWit script construction remains on the upstream path when CashAddr does not match. Daemon `validateaddress` remains authoritative for configured and username-derived payout acceptance; the final live BCH qualification therefore checks those entry paths as well as script construction.'''
          if old not in s:
              raise SystemExit('BCH documentation marker missing')
          s = s.replace(old, new, 1)
          old = '''The remaining implementation work therefore belongs to four generic layers:\n\n1. **GBT request shaping**: already implemented through `gbtparams`, `gbtdrop`, and `gbtargs`.\n2. **Address/script codecs**: add configurable CashAddr support shared by BCH and XEC while preserving normal Base58/SegWit behavior by default.\n3. **Coinbase/block capabilities**: optional transaction timestamp, optional block suffix, and configurable mandatory outputs sourced from GBT.\n4. **Mining semantics**: selectable target source, selectable post-submit chain-tip behavior, and strict per-client SV1 version-mask negotiation/reconstruction.'''
          new = '''The implementation is now decomposed into four generic layers:\n\n1. **GBT request shaping** through `gbtparams`, `gbtdrop`, and `gbtargs`.\n2. **Address/script codecs** through configurable CashAddr support shared by BCH and XEC while preserving normal Base58/SegWit behavior by default.\n3. **Coinbase/block capabilities** through optional transaction timestamp, optional block suffix, and configurable mandatory outputs sourced from GBT.\n4. **Mining semantics** through selectable target source, selectable post-submit chain-tip behavior, and strict per-client SV1 version-mask negotiation/reconstruction.'''
          if old not in s:
              raise SystemExit('layer documentation marker missing')
          s = s.replace(old, new, 1)
          appendix = '''\n\n## Hosted regression matrix\n\nThe source-level qualification matrix intentionally tests protocol profiles rather than branching on coin names. `test/chain_profiles.c` runs each profile in a fresh child process so startup-static configuration cannot bleed between cases.\n\n| Lane | Generic profile exercised in hosted tests | Prior live/provenance evidence |\n| --- | --- | --- |\n| BTC | all optional multichain capabilities unset | upstream default contract |\n| DGB | Bitcoin-default consensus capabilities | deployed with upstream binary |\n| AUR | Bitcoin-default consensus capabilities | deployed with upstream binary |\n| BFX | Bitcoin-default consensus capabilities | deployed with upstream binary |\n| LCC | Bitcoin-default serialization; SHA256d GBT selection remains `gbtparams.powalgo` | unified fork already mined an accepted main-chain block at height 4507116 |\n| BCH | `cashaddr_prefix=bitcoincash`; request profile drops `rules` | deployed `skaisser/ckpool` lineage audited for BCH protocol deltas |\n| PPC | `coinbase_txntime`, `block_suffix=00`, `validate_coinbase=false` | 51 consecutive qualified testnet blocks on the retained keyless lineage |\n| XEC | eCash CashAddr, mandatory GBT outputs, RTT target, `preciousblock=false` | fields and output ordering cross-checked against Bitcoin ABC GBT and reference ckpool |\n\nThe hosted matrix additionally checks missing RTT-target fallback and the maximum configured 512-byte script boundary. Hosted success is a source/build regression gate, not a substitute for the final ARM64 and live-node acceptance pass.\n'''
          if '## Hosted regression matrix' not in s:
              s += appendix
          p.write_text(s)
          PY

      - name: Native hosted build and tests
        run: |
          set -Eeuo pipefail
          ./autogen.sh
          ./configure
          make -j2
          make check

      - name: Source policy audit
        run: |
          set -Eeuo pipefail
          git diff --check
          ! grep -RniE 'if[[:space:]]*\([^)]*(BTC|BCH|DGB|AUR|BFX|LCC|PPC|XEC)|strcmp\([^,]+,[[:space:]]*"(BTC|BCH|DGB|AUR|BFX|LCC|PPC|XEC)' \
            src/multichain.c src/payout.c src/bitcoin.c src/stratifier.c
          ! grep -RniE '/home/pi5claw|192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+' MULTICHAIN.md src test
          grep -q 'cashaddr_prefix.*bitcoincash' MULTICHAIN.md
          grep -q 'gbttarget.*rtt/nexttarget' MULTICHAIN.md
          grep -q 'max-script-boundary' test/chain_profiles.c

      - name: Commit tested hardening
        run: |
          set -Eeuo pipefail
          git add src/stratifier.c test/Makefile.am test/chain_profiles.c MULTICHAIN.md
          git diff --cached --check
          git commit -m "multichain: harden profile regressions and output bounds"
          git push origin HEAD:unified-multichain-v1
          git log -4 --oneline
