name: LCC version-zero GBT fix once

on:
  push:
    branches:
      - unified-multichain-v1
    paths:
      - .github/workflows/lcc-version-zero-fix-once.yml

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-multichain-v1
          fetch-depth: 0

      - name: Patch generic GBT version parsing
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/bitcoin.c')
          s = p.read_text()

          old_decl = 'yyjson_val *rules_array, *coinbase_aux, *res_val, *root;'
          new_decl = 'yyjson_val *rules_array, *coinbase_aux, *res_val, *root, *version_val;'
          if s.count(old_decl) != 1:
              raise SystemExit(f'declaration match count={s.count(old_decl)}')
          s = s.replace(old_decl, new_decl, 1)

          old_get = 'version = yyjson_get_num(yyjson_obj_get(res_val, "version"));'
          new_get = 'version_val = yyjson_obj_get(res_val, "version");\n\tversion = yyjson_get_num(version_val);'
          if s.count(old_get) != 1:
              raise SystemExit(f'version getter match count={s.count(old_get)}')
          s = s.replace(old_get, new_get, 1)

          old_check = 'if (unlikely(!previousblockhash || !target || !version || !curtime || !bits || !coinbase_aux)) {'
          new_check = 'if (unlikely(!previousblockhash || !target || !version_val || !yyjson_is_num(version_val) ||\n\t             !curtime || !bits || !coinbase_aux)) {'
          if s.count(old_check) != 1:
              raise SystemExit(f'version presence check match count={s.count(old_check)}')
          s = s.replace(old_check, new_check, 1)

          p.write_text(s)
          PY

          grep -n -A8 -B8 'version_val = yyjson_obj_get' src/bitcoin.c

      - name: Build and test
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcap-dev libcurl4-openssl-dev libssl-dev yasm
          git submodule update --init --recursive
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          make -C test check

      - name: Static regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'version_val = yyjson_obj_get(res_val, "version");' src/bitcoin.c
          grep -F '!version_val || !yyjson_is_num(version_val)' src/bitcoin.c
          if grep -F '!previousblockhash || !target || !version ||' src/bitcoin.c; then
            echo 'old version-zero rejection still present'
            exit 1
          fi

      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Samuel Castel'
          git config user.email '2681949+samuelcstl@users.noreply.github.com'
          git rm .github/workflows/lcc-version-zero-fix-once.yml
          git add src/bitcoin.c
          git commit -m 'gbt: accept numeric block version zero'
          git push origin HEAD:unified-multichain-v1
