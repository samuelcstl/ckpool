name: integrate strict BIP310 once

on:
  push:
    branches:
      - unified-multichain-v1

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-multichain-v1
          submodules: recursive

      - name: Apply strict BIP310 integration
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/bip310_integrate.py
          git diff --check
          git diff --stat

      - name: Build and test
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcap-dev libcurl4-openssl-dev libssl-dev yasm
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          make -C test check

      - name: Strict BIP310 gates
        run: |
          set -Eeuo pipefail
          grep -F 'effective_mask = bip310_negotiate_mask(ckpool.version_mask, miner_mask);' src/stratifier.c
          grep -F 'bip310_version_bits_valid(version_bits32, client->version_mask)' src/stratifier.c
          grep -F 'bip310_apply_version(wb->version, client->version_mask' src/stratifier.c
          grep -F 'client->version_rolling = true;' src/stratifier.c
          grep -F 'bip310_parse_mask(vmask, &ckpool.version_mask)' src/ckpool.c
          if grep -F '((~ckpool.version_mask) & version_mask32)' src/stratifier.c; then
            echo 'old global-mask submit validation survived'
            exit 1
          fi
          if grep -F 'BIP320 mask OR (SV1)' src/stratifier.c; then
            echo 'old OR reconstruction survived'
            exit 1
          fi

      - name: Commit validated integration
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/bip310-integrate-once.yml .github/scripts/bip310_integrate.py
          git config user.name 'Samuel Castel'
          git config user.email '2681949+samuelcstl@users.noreply.github.com'
          git add src/stratifier.c src/ckpool.c .github/workflows/bip310-integrate-once.yml .github/scripts/bip310_integrate.py
          git commit -m 'bip310: negotiate and enforce version masks per client'
          git push origin HEAD:unified-multichain-v1
