name: integrate strict BIP310 once

on:
  push:
    branches:
      - unified-multichain-v1

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-multichain-v1
          submodules: recursive
      - name: Apply strict BIP310 integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {n}")
              return text.replace(old, new, 1)

          p = Path('src/stratifier.c')
          s = p.read_text()

          s = replace_once(
              s,
              '#include "sha2.h"\n#include "stratifier.h"',
              '#include "sha2.h"\n#include "bip310.h"\n#include "stratifier.h"',
              'stratifier include')

          s = replace_once(
              s,
              '\tint64_t suggest_diff; /* Stratum client suggested diff */\n\tdouble best_diff; /* Best share found by this instance */',
              '\tint64_t suggest_diff; /* Stratum client suggested diff */\n\tdouble best_diff; /* Best share found by this instance */\n\n\t/* BIP310 version rolling is negotiated per connection. */\n\tbool version_rolling;\n\tuint32_t version_mask; /* Last mask returned to this miner. */\n\tunsigned int version_min_bit_count; /* Diagnostic request, 0 if omitted. */',
              'client BIP310 state')

          old_version = '''\t/* nVersion: full replace (SV2) or BIP320 mask OR (SV1) */
\tif (full_version) {
\t\tdata32 = (uint32_t *)data;
\t\t*data32 = htobe32(version_field);
\t} else if (version_field) {
\t\tuint32_t version_mask = htobe32(version_field);

\t\tdata32 = (uint32_t *)data;
\t\t*data32 |= version_mask;
\t}
'''
          new_version = '''\t/* nVersion: full replace for SV2; strict BIP310 replacement for SV1.
\t * A zero in version_bits must clear a job bit inside the negotiated mask,
\t * hence OR semantics are incorrect here. */
\tdata32 = (uint32_t *)data;
\tif (full_version) {
\t\t*data32 = htobe32(version_field);
\t} else if (client->version_rolling) {
\t\tuint32_t version = bip310_apply_version(wb->version, client->version_mask,
\t\t\t\t\t\t   version_field);

\t\t*data32 = htobe32(version);
\t}
'''
          s = replace_once(s, old_version, new_version, 'SV1 nVersion reconstruction')

          s = replace_once(
              s,
              '\tconst char *workername, *job_id, *ntime, *version_mask;',
              '\tconst char *workername, *job_id, *ntime, *version_bits;',
              'submit variable name')
          s = replace_once(
              s,
              '\tuint32_t ntime32, version_mask32 = 0;',
              '\tuint32_t ntime32, version_bits32 = 0;',
              'submit mask storage')

          old_submit = '''\tversion_mask = yyjson_mut_get_str(yyjson_mut_arr_get(params_val, 5));
\tif (version_mask && strlen(version_mask) && validhex(version_mask)) {
\t\tsscanf(version_mask, "%x", &version_mask32);
\t\t// check version mask
\t\tif (version_mask32 && ((~ckpool.version_mask) & version_mask32) != 0) {
\t\t\t// means client changed some bits which server doesn't allow to change
\t\t\terr = SE_INVALID_VERSION_MASK;
\t\t\tgoto out;
\t\t}
\t}
'''
          new_submit = '''\tversion_bits = yyjson_mut_get_str(yyjson_mut_arr_get(params_val, 5));
\tif (client->version_rolling) {
\t\t/* BIP310 activates exactly one extra mining.submit parameter. */
\t\tif (unlikely(yyjson_mut_arr_size(params_val) != 6 ||
\t\t             !version_bits ||
\t\t             !bip310_parse_mask(version_bits, &version_bits32) ||
\t\t             !bip310_version_bits_valid(version_bits32, client->version_mask))) {
\t\t\terr = SE_INVALID_VERSION_MASK;
\t\t\tgoto out;
\t\t}
\t} else if (unlikely(yyjson_mut_arr_size(params_val) != 5)) {
\t\t/* The sixth field is only valid after successful version-rolling setup. */
\t\terr = SE_INVALID_VERSION_MASK;
\t\tgoto out;
\t}
'''
          s = replace_once(s, old_submit, new_submit, 'strict submit mask validation')

          # The remaining occurrences are the validated BIP310 version bits passed
          # into share reconstruction and proxy forwarding.
          if s.count('version_mask32') != 2:
              raise SystemExit(f"expected two remaining version_mask32 uses, got {s.count('version_mask32')}")
          s = s.replace('version_mask32', 'version_bits32')

          marker = '        if (cmdmatch(method, "mining.configure")) {'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('mining.configure handler start not found')
          end_marker = '\n\t/* We should only accept requests from subscribed and authed users here'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('mining.configure handler end not found')

          handler = '''        if (cmdmatch(method, "mining.configure")) {
\t\tyyjson_mut_doc *doc;
\t\tyyjson_mut_val *root, *result, *extensions = NULL, *extparams = NULL;
\t\tyyjson_mut_val *mask_val, *min_bits_val, *id_copy;
\t\tuint32_t miner_mask = BIP310_FULL_MASK, effective_mask;
\t\tunsigned int min_bits = 0;
\t\tchar version_str[9];
\t\tbool requested = false, config_error = false;
\t\tsize_t i, count = 0;

\t\tLOGINFO("Mining configure requested from %s %s", client->identity,
\t\t\tclient->address);

\t\tdoc = yyjson_mut_doc_new(&ckyyalc);
\t\troot = yyjson_mut_obj(doc);
\t\tresult = yyjson_mut_obj(doc);
\t\tif (unlikely(!doc || !root || !result))
\t\t\tquit(1, "Failed to allocate mining.configure response");
\t\tyyjson_mut_doc_set_root(doc, root);
\t\tyyjson_mut_obj_add_val(doc, root, "result", result);
\t\tif (id_val && (id_copy = yyjson_mut_val_mut_copy(doc, id_val)))
\t\t\tyyjson_mut_obj_add_val(doc, root, "id", id_copy);
\t\telse
\t\t\tyyjson_mut_obj_add_null(doc, root, "id");
\t\tyyjson_mut_obj_add_null(doc, root, "error");

\t\tif (yyjson_mut_is_arr(params_val) && yyjson_mut_arr_size(params_val) >= 1) {
\t\t\textensions = yyjson_mut_arr_get(params_val, 0);
\t\t\textparams = yyjson_mut_arr_get(params_val, 1);
\t\t}

\t\t/* BIP310 requires a result for every requested extension. Unknown
\t\t * extensions are explicitly reported as unsupported. */
\t\tif (yyjson_mut_is_arr(extensions)) {
\t\t\tcount = yyjson_mut_arr_size(extensions);
\t\t\tfor (i = 0; i < count; ++i) {
\t\t\t\tconst char *extension = yyjson_mut_get_str(yyjson_mut_arr_get(extensions, i));

\t\t\t\tif (!extension || !*extension)
\t\t\t\t\tcontinue;
\t\t\t\tif (!strcmp(extension, "version-rolling")) {
\t\t\t\t\trequested = true;
\t\t\t\t\tcontinue;
\t\t\t\t}
\t\t\t\t{
\t\t\t\t\tyyjson_mut_val *key = yyjson_mut_strcpy(doc, extension);
\t\t\t\t\tyyjson_mut_val *unsupported = yyjson_mut_bool(doc, false);

\t\t\t\t\tif (key && unsupported)
\t\t\t\t\t\tyyjson_mut_obj_put(result, key, unsupported);
\t\t\t\t}
\t\t\t}
\t\t}

\t\tif (requested) {
\t\t\tif (extparams && !yyjson_mut_is_obj(extparams)) {
\t\t\t\tconfig_error = true;
\t\t\t} else if (extparams) {
\t\t\t\tmask_val = yyjson_mut_obj_get(extparams, "version-rolling.mask");
\t\t\t\tif (mask_val) {
\t\t\t\t\tconst char *mask = yyjson_mut_get_str(mask_val);

\t\t\t\t\tif (!mask || !bip310_parse_mask(mask, &miner_mask))
\t\t\t\t\t\tconfig_error = true;
\t\t\t\t}

\t\t\t\tmin_bits_val = yyjson_mut_obj_get(extparams,
\t\t\t\t\t\t\t       "version-rolling.min-bit-count");
\t\t\t\tif (min_bits_val) {
\t\t\t\t\tint requested_bits;

\t\t\t\t\tif (!yyjson_mut_is_int(min_bits_val) ||
\t\t\t\t\t    (requested_bits = yyjson_mut_get_int(min_bits_val)) < 0) {
\t\t\t\t\t\tconfig_error = true;
\t\t\t\t\t} else {
\t\t\t\t\t\tmin_bits = (unsigned int)requested_bits;
\t\t\t\t\t}
\t\t\t\t} else {
\t\t\t\t\t/* ESP-Miner currently omits this formally required BIP310
\t\t\t\t\t * parameter. Treat omission as zero for compatibility while
\t\t\t\t\t * keeping mask semantics strict. */
\t\t\t\t\tLOGINFO("BIP310 client %s omitted min-bit-count; assuming 0",
\t\t\t\t\t\tclient->identity);
\t\t\t\t}
\t\t\t}

\t\t\tif (config_error) {
\t\t\t\tyyjson_mut_obj_add_strcpy(doc, result, "version-rolling",
\t\t\t\t\t\t\t   "invalid version-rolling parameters");
\t\t\t} else {
\t\t\t\teffective_mask = bip310_negotiate_mask(ckpool.version_mask, miner_mask);
\t\t\t\tclient->version_rolling = true;
\t\t\t\tclient->version_mask = effective_mask;
\t\t\t\tclient->version_min_bit_count = min_bits;
\t\t\t\tbip310_format_mask(version_str, effective_mask);
\t\t\t\tyyjson_mut_obj_add_bool(doc, result, "version-rolling", true);
\t\t\t\tyyjson_mut_obj_add_strcpy(doc, result, "version-rolling.mask",
\t\t\t\t\t\t\t   version_str);
\t\t\t\tLOGNOTICE("BIP310 %s miner_mask=%08x server_mask=%08x effective=%08x min_bits=%u",
\t\t\t\t\t  client->identity, miner_mask, ckpool.version_mask,
\t\t\t\t\t  effective_mask, min_bits);
\t\t\t\tif (bip310_popcount(effective_mask) < min_bits)
\t\t\t\t\tLOGWARNING("BIP310 %s requested %u bits but effective mask %s exposes %u",
\t\t\t\t\t\t   client->identity, min_bits, version_str,
\t\t\t\t\t\t   bip310_popcount(effective_mask));
\t\t\t}
\t\t}

\t\tstratum_add_yysend(sdata, doc, client_id, SM_CONFIGURE);
\t\treturn;
\t}
'''
          s = s[:start] + handler + s[end:]
          p.write_text(s)

          p = Path('src/ckpool.c')
          c = p.read_text()
          c = replace_once(
              c,
              '#include "libckpool.h"\n#include "generator.h"',
              '#include "libckpool.h"\n#include "bip310.h"\n#include "generator.h"',
              'ckpool include')
          old_cfg = '''\tyyjson_obj_get_string(&vmask, json_conf, "version_mask");
\tif (vmask && strlen(vmask) && validhex(vmask))
\t\tsscanf(vmask, "%x", &ckpool.version_mask);
\telse
\t\tckpool.version_mask = 0x1fffe000;
\tdealloc(vmask);
'''
          new_cfg = '''\tyyjson_obj_get_string(&vmask, json_conf, "version_mask");
\tif (vmask && strlen(vmask)) {
\t\tif (!bip310_parse_mask(vmask, &ckpool.version_mask)) {
\t\t\tLOGWARNING("Invalid BIP310 version_mask %s; using 1fffe000", vmask);
\t\t\tckpool.version_mask = 0x1fffe000;
\t\t}
\t} else {
\t\tckpool.version_mask = 0x1fffe000;
\t}
\tdealloc(vmask);
'''
          c = replace_once(c, old_cfg, new_cfg, 'server mask parsing')
          p.write_text(c)
          PY

          echo '=== BIP310 integration diff ==='
          git diff --check
          git diff --stat
          git diff -- src/stratifier.c src/ckpool.c
      - name: Build and test
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libcap-dev libcurl4-openssl-dev libssl-dev yasm
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          make -C test check
      - name: Strict BIP310 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'effective_mask = bip310_negotiate_mask(ckpool.version_mask, miner_mask);' src/stratifier.c
          grep -F 'bip310_version_bits_valid(version_bits32, client->version_mask)' src/stratifier.c
          grep -F 'bip310_apply_version(wb->version, client->version_mask' src/stratifier.c
          grep -F 'client->version_rolling = true;' src/stratifier.c
          grep -F 'bip310_parse_mask(vmask, &ckpool.version_mask)' src/ckpool.c
          if grep -F '((~ckpool.version_mask) & version_mask32)' src/stratifier.c; then
            echo 'old global-mask submit validation survived'
            exit 1
          fi
          if grep -F 'BIP320 mask OR (SV1)' src/stratifier.c; then
            echo 'old OR reconstruction survived'
            exit 1
          fi
      - name: Commit validated integration and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/bip310-integrate-once.yml
          git config user.name 'Samuel Castel'
          git config user.email '2681949+samuelcstl@users.noreply.github.com'
          git add src/stratifier.c src/ckpool.c .github/workflows/bip310-integrate-once.yml
          git commit -m 'bip310: negotiate and enforce version masks per client'
          git push origin HEAD:unified-multichain-v1
