name: Unified generic CashAddr wiring once

on:
  push:
    branches:
      - agent/unified-cashaddr-wire-v1
    paths:
      - .github/workflows/unified-cashaddr-wire-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-cashaddr-wire-v1
          fetch-depth: 0

      - name: Wire configurable CashAddr support
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new, label in replacements:
                  n = s.count(old)
                  if n != 1:
                      raise SystemExit(f'{path}: {label}: expected 1 match, got {n}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('src/ckpool.h', [
              (
              '''\t/* Coinbase data */
          \tchar *btcaddress; // Address to mine to''',
              '''\t/* Coinbase data */
          \tchar *cashaddr_prefix; // Optional CashAddr HRP; NULL preserves upstream address behaviour
          \tchar *btcaddress; // Address to mine to''',
              'ckpool cashaddr field'),
          ])

          patch('src/ckpool.c', [
              (
              '''\tyyjson_obj_get_string(&ckpool.btcaddress, json_conf, "btcaddress");
          \tyyjson_obj_get_string(&ckpool.btcsig, json_conf, "btcsig");''',
              '''\tyyjson_obj_get_string(&ckpool.cashaddr_prefix, json_conf, "cashaddr_prefix");
          \tif (ckpool.cashaddr_prefix &&
          \t    (!ckpool.cashaddr_prefix[0] || strlen(ckpool.cashaddr_prefix) > 83 ||
          \t     strchr(ckpool.cashaddr_prefix, ':'))) {
          \t\tquit(1, "Invalid cashaddr_prefix %s", ckpool.cashaddr_prefix);
          \t}
          \tyyjson_obj_get_string(&ckpool.btcaddress, json_conf, "btcaddress");
          \tyyjson_obj_get_string(&ckpool.btcsig, json_conf, "btcsig");''',
              'parse cashaddr_prefix'),
              (
              '''\tprintf("btcaddress = %s\\n", ckpool.btcaddress ? ckpool.btcaddress : "(none)");
          \tprintf("btcsig = %s\\n", ckpool.btcsig ? ckpool.btcsig : "(none)");''',
              '''\tprintf("cashaddr_prefix = %s\\n", ckpool.cashaddr_prefix ? ckpool.cashaddr_prefix : "(none)");
          \tprintf("btcaddress = %s\\n", ckpool.btcaddress ? ckpool.btcaddress : "(none)");
          \tprintf("btcsig = %s\\n", ckpool.btcsig ? ckpool.btcsig : "(none)");''',
              'testconfig cashaddr output'),
          ])

          p = Path('src/bitcoin.c')
          s = p.read_text()
          old = '#include "bitcoin.h"\n#include "stratifier.h"'
          new = '#include "bitcoin.h"\n#include "cashaddr.h"\n#include "stratifier.h"'
          if s.count(old) != 1:
              raise SystemExit(f'bitcoin include: expected 1 match, got {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''bool validate_address(connsock_t *cs, const char *address, bool *script, bool *segwit)
          {
          \tyyjson_doc *doc;
          \tyyjson_val *root, *res_val, *valid_val, *tmp_val;
          \tchar rpc_req[128];
          \tbool ret = false;

          \tif (unlikely(!address)) {
          \t\tLOGWARNING("Null address passed to validate_address");
          \t\treturn ret;
          \t}

          \tsnprintf(rpc_req, 128, "{\\\"method\\\": \\\"validateaddress\\\", \\\"params\\\": [\\\"%s\\\"]}\\n", address);'''
          new = '''bool validate_address(connsock_t *cs, const char *address, bool *script, bool *segwit)
          {
          \tyyjson_doc *doc;
          \tyyjson_val *root, *res_val, *valid_val, *tmp_val;
          \tchar rpc_req[256], normalized[196];
          \tconst char *rpc_address = address;
          \tuint8_t cash_hash[20];
          \tbool cash_script = false, is_cashaddr = false;
          \tbool ret = false;

          \tif (unlikely(!address)) {
          \t\tLOGWARNING("Null address passed to validate_address");
          \t\treturn ret;
          \t}

          \t/* When configured, recognise CashAddr locally and canonicalise bare or
          \t * uppercase forms before asking the daemon to validate the address. */
          \tif (ckpool.cashaddr_prefix &&
          \t    cashaddr_decode(address, ckpool.cashaddr_prefix, cash_hash, &cash_script) &&
          \t    cashaddr_normalize(normalized, sizeof(normalized), address, ckpool.cashaddr_prefix)) {
          \t\tis_cashaddr = true;
          \t\trpc_address = normalized;
          \t}

          \tsnprintf(rpc_req, sizeof(rpc_req),
          \t\t "{\\\"method\\\": \\\"validateaddress\\\", \\\"params\\\": [\\\"%s\\\"]}\\n",
          \t\t rpc_address);'''
          if s.count(old) != 1:
              raise SystemExit(f'validate_address prologue: expected 1 match, got {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''\tret = true;
          \ttmp_val = yyjson_obj_get(res_val, "isscript");'''
          new = '''\tret = true;
          \tif (is_cashaddr) {
          \t\t*script = cash_script;
          \t\t*segwit = false;
          \t\tgoto out;
          \t}
          \ttmp_val = yyjson_obj_get(res_val, "isscript");'''
          if s.count(old) != 1:
              raise SystemExit(f'validate_address classification: expected 1 match, got {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/stratifier.c')
          s = p.read_text()
          old = '#include "bitcoin.h"\n#include "sha2.h"'
          new = '#include "bitcoin.h"\n#include "cashaddr.h"\n#include "sha2.h"'
          if s.count(old) != 1:
              raise SystemExit(f'stratifier include: expected 1 match, got {s.count(old)}')
          s = s.replace(old, new, 1)

          count = s.count('address_to_txn(')
          if count != 6:
              raise SystemExit(f'address_to_txn use count: expected 6, got {count}')
          s = s.replace('address_to_txn(', 'payout_address_to_txn(')

          marker = '''static uchar scriptsig_header_bin[41];
          static const double nonces = 4294967296;'''
          helper = '''static uchar scriptsig_header_bin[41];

          /* Convert a configured/user payout address to scriptPubKey. CashAddr is an
           * optional orthogonal codec; when unset or when the address is not CashAddr,
           * preserve the normal Base58/SegWit path byte-for-byte. */
          static int payout_address_to_txn(char *p2h, const char *addr, const bool script, const bool segwit)
          {
          \tif (ckpool.cashaddr_prefix) {
          \t\tbool cash_script;
          \t\tint len = cashaddr_to_script(addr, ckpool.cashaddr_prefix, (uint8_t *)p2h, &cash_script);

          \t\tif (len)
          \t\t\treturn len;
          \t}
          \treturn address_to_txn(p2h, addr, script, segwit);
          }

          static const double nonces = 4294967296;'''
          if s.count(marker) != 1:
              raise SystemExit(f'payout helper marker: expected 1 match, got {s.count(marker)}')
          s = s.replace(marker, helper, 1)
          p.write_text(s)

          p = Path('test/Makefile.am')
          s = p.read_text()
          old = '''check_PROGRAMS = sha256 bip310
          TESTS = sha256 bip310

          sha256_SOURCES = sha256.c
          bip310_SOURCES = bip310.c'''
          new = '''check_PROGRAMS = sha256 bip310 cashaddr
          TESTS = sha256 bip310 cashaddr

          sha256_SOURCES = sha256.c
          bip310_SOURCES = bip310.c
          cashaddr_SOURCES = cashaddr.c'''
          if s.count(old) != 1:
              raise SystemExit(f'test Makefile: expected 1 match, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

          cat > test/cashaddr.c <<'EOF'
          #include <assert.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>

          #include "cashaddr.h"

          static void expect_p2pkh(const char *addr, const char *prefix)
          {
              uint8_t script[64];
              bool p2sh = true;
              int len = cashaddr_to_script(addr, prefix, script, &p2sh);

              assert(len == 25);
              assert(!p2sh);
              assert(script[0] == 0x76);
              assert(script[1] == 0xa9);
              assert(script[2] == 0x14);
              assert(script[23] == 0x88);
              assert(script[24] == 0xac);
          }

          int main(void)
          {
              char normalized[196];

              expect_p2pkh("bitcoincash:qqwytctx80gcz65xrhmd45qw68stwzedxvat6jnqrp", "bitcoincash");
              expect_p2pkh("qqwytctx80gcz65xrhmd45qw68stwzedxvat6jnqrp", "bitcoincash");
              expect_p2pkh("ecash:qzph75apzfr0zty0sjuzzeywrrtfx8hgzswrxvadel", "ecash");

              assert(cashaddr_normalize(normalized, sizeof(normalized),
                  "QQWYTCTX80GCZ65XRHMD45QW68STWZEDXVAT6JNQRP", "bitcoincash"));
              assert(strcmp(normalized,
                  "bitcoincash:qqwytctx80gcz65xrhmd45qw68stwzedxvat6jnqrp") == 0);

              assert(!cashaddr_to_script(
                  "bitcoincash:qqwytctx80gcz65xrhmd45qw68stwzedxvat6jnqrp",
                  "ecash", (uint8_t *)normalized, NULL));

              puts("PASS: cashaddr");
              return 0;
          }
          EOF

          grep -n -A8 -B4 'cashaddr_prefix' src/ckpool.c | head -80
          grep -n -A18 -B3 'payout_address_to_txn' src/stratifier.c | head -80

      - name: Build and test
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libcap-dev libcurl4-openssl-dev libssl-dev yasm
          git submodule update --init --recursive
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          make -C test check

      - name: Zero-config regression and config parsing
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'return address_to_txn(p2h, addr, script, segwit);' src/stratifier.c
          grep -F 'cashaddr_prefix = %s' src/ckpool.c
          test "$(grep -c 'payout_address_to_txn(' src/stratifier.c)" -eq 7

      - name: Commit validated capability and remove workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Samuel Castel'
          git config user.email '2681949+samuelcstl@users.noreply.github.com'
          git rm .github/workflows/unified-cashaddr-wire-once.yml
          git add src/ckpool.h src/ckpool.c src/bitcoin.c src/stratifier.c test/Makefile.am test/cashaddr.c
          git commit -m 'cashaddr: wire configurable payout codec end to end'
          git push origin HEAD:agent/unified-cashaddr-wire-v1
